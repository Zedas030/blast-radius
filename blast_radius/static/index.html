<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast-Radius</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23e5484d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e5484d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e5484d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>Blast-Radius</div>
  <nav id="tabs">
    <button data-tab="map" class="active">Map</button>
    <button data-tab="spof">Single points of failure</button>
    <button data-tab="live">Live &amp; cause</button>
    <button data-tab="changes">Changes</button>
    <button data-tab="health">Health</button>
  </nav>
  <div id="status-pill" class="pill">…</div>
</header>

<main>
  <section id="tab-map" class="tab active">
    <aside id="side">
      <div class="search">
        <input id="q" type="search" placeholder="Search: pi, fritzbox, zigbee, heating …" autocomplete="off">
        <div id="results"></div>
      </div>
      <div class="hint" id="hint">Click a node to simulate its failure. Shift-click adds more nodes to the same failure.
        Ask in plain words, e.g. <a href="#" data-ask="What happens if the Pi crashes?">What happens if the Pi crashes?</a></div>
      <div id="impact"></div>
    </aside>
    <div id="canvas-wrap">
      <div id="cy"></div>
      <div class="toolbar">
        <label><input type="checkbox" id="show-entities"> entities</label>
        <button id="btn-fit" title="Fit to screen">Fit</button>
        <button id="btn-reset" title="Clear simulation">Reset</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section id="tab-spof" class="tab page"><div id="spof"></div></section>
  <section id="tab-live" class="tab page"><div id="live"></div></section>
  <section id="tab-changes" class="tab page"><div id="changes"></div></section>
  <section id="tab-health" class="tab page"><div id="health"></div></section>
</main>

<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
