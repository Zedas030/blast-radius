[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius"
version = "1.1.0"
description = "Automatic dependency map of a homelab / smart home that answers: what fails if X fails?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
blast-radius = "blast_radius.cli:main"
blast-radius-collect = "blast_radius.collect:main"

[tool.setuptools]
packages = ["blast_radius"]

[tool.setuptools.package-data]
blast_radius = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test against a running Docker deployment"]
addopts = "-m 'not e2e'"
